[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windbg-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for WinDbg & WinDbgX with DebugExt reverse-engineering tools and Google Antigravity support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0.0",
]

[project.scripts]
windbg-mcp = "windbg_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windbg_mcp"]

